# Alerting rules evaluated by Prometheus. Fire into Alertmanager.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloud-platform
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cloud-platform
spec:
  groups:
    - name: cloud-platform.rules
      rules:
        - alert: CloudPlatformHighErrorRate
          # More than 5% of requests are 5xx over the last 5 minutes.
          expr: |
            sum(rate(app_http_requests_total{status=~"5.."}[5m]))
              /
            sum(rate(app_http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on cloud-platform"
            description: "5xx error ratio is above 5% for 5 minutes."

        - alert: CloudPlatformHighLatency
          # p95 request latency above 1s for 10 minutes.
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(app_http_request_duration_seconds_bucket[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency on cloud-platform"
            description: "95th percentile latency has exceeded 1s for 10 minutes."

        - alert: CloudPlatformAbsent
          # No metrics scraped -> the app is likely down.
          expr: absent(app_http_requests_total)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cloud-platform metrics are absent"
            description: "Prometheus is not scraping any cloud-platform targets."
