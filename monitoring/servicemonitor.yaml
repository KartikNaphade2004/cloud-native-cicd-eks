# Tells the Prometheus Operator to scrape the app's /metrics endpoint.
# Works across the dev and prod namespaces via namespaceSelector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloud-platform
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cloud-platform
spec:
  namespaceSelector:
    matchNames:
      - cloud-platform
      - cloud-platform-dev
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-platform
  endpoints:
    - port: http          # the Service port named "http"
      path: /metrics
      interval: 15s
