apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-platform
  labels:
    app.kubernetes.io/name: cloud-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-platform
      annotations:
        # Tell Prometheus to scrape this pod (used in Phase 5).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Spread pods across nodes for resilience.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloud-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Image name is set by Kustomize / CI; this is a placeholder.
          image: cloud-native-cicd:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "set-by-overlay"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
