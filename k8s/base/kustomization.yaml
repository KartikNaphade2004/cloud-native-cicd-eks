apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cloud-native-cicd
    includeSelectors: false

# CI overrides the image name+tag with the ECR image and commit SHA:
#   kustomize edit set image cloud-native-cicd=<ecr-url>:<sha>
images:
  - name: cloud-native-cicd
    newTag: latest
