apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloud-platform

resources:
  - namespace.yaml
  - ../../base

# Prod runs more replicas for availability (HPA can scale further).
replicas:
  - name: cloud-platform
    count: 3

patches:
  - target:
      kind: Deployment
      name: cloud-platform
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "prod"
