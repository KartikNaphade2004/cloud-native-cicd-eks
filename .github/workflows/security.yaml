name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly scan to catch newly disclosed vulnerabilities.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  filesystem-scan:
    name: Trivy filesystem (deps & secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  iac-scan:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scan Terraform and Kubernetes manifests for insecure settings.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Checkov (Terraform & Kubernetes)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true   # report findings without failing the build
