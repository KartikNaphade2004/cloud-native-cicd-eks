apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-platform-dev
  namespace: argocd
  # Ensures ArgoCD removes the app cleanly if this manifest is deleted.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloud-native-cicd

  source:
    repoURL: https://github.com/KartikNaphade2004/cloud-native-cicd-eks.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-platform-dev

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
